<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sutra</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,500,0,0"
    />
    <script src="https://st.max.ru/js/max-web-app.js"></script>
  </head>
  <body>
    <div id="app">
      <main id="screen" class="screen-scroll" role="main"></main>
      <nav class="tabs tabs-primary bottom-dock" aria-label="Разделы CRM">
        <button type="button" class="tab active" data-primary="today">
          <span class="material-symbols-outlined tab-icon" aria-hidden="true">calendar_month</span>
          <span class="tab-label">Сегодня</span>
        </button>
        <button type="button" class="tab" data-primary="clients">
          <span class="material-symbols-outlined tab-icon" aria-hidden="true">groups</span>
          <span class="tab-label">Клиенты</span>
        </button>
        <button type="button" class="tab" data-primary="directories">
          <span class="material-symbols-outlined tab-icon" aria-hidden="true">menu_book</span>
          <span class="tab-label">Справочники</span>
        </button>
      </nav>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
