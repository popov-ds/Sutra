<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sutra</title>
    <script src="https://st.max.ru/js/max-web-app.js"></script>
  </head>
  <body>
    <div id="app">
      <main id="screen" class="screen-scroll" role="main"></main>
      <nav class="tabs tabs-primary tabs--icons bottom-dock" aria-label="Разделы CRM">
        <button type="button" class="tab active" data-primary="today" aria-label="Сегодня">
          <span class="material-symbols-outlined tab-icon" aria-hidden="true">calendar_month</span>
        </button>
        <button type="button" class="tab" data-primary="clients" aria-label="Клиенты">
          <span class="material-symbols-outlined tab-icon" aria-hidden="true">groups</span>
        </button>
        <button type="button" class="tab" data-primary="directories" aria-label="Справочники">
          <span class="material-symbols-outlined tab-icon" aria-hidden="true">menu_book</span>
        </button>
        <button type="button" class="tab" data-primary="cloud" hidden aria-label="Облако">
          <span class="material-symbols-outlined tab-icon" aria-hidden="true">cloud</span>
        </button>
      </nav>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
