# Прод на VPS рядом с /opt/solver и /opt/YogaShedulerTelegramBot — не трогаем их порты.
# HTTP бота: host network, только 127.0.0.1:18081 (nginx → отдельный server_name).
# Запуск: docker compose -f docker-compose.vps.yml up -d --build

name: sutramaxbot

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sutra
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sutra}
      POSTGRES_DB: sutra_max_bot
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - sutramax_pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sutra -d sutra_max_bot"]
      interval: 10s
      timeout: 5s
      retries: 5

  bot:
    build: .
    command: npm run start:bot
    network_mode: host
    env_file: .env
    environment:
      NODE_OPTIONS: "--use-system-ca"
      HTTP_PORT: 18081
      HTTP_BIND: 127.0.0.1
      DATA_DIR: /data
      DATABASE_URL: postgresql://sutra:${POSTGRES_PASSWORD:-sutra}@127.0.0.1:55433/sutra_max_bot
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://sutra.max.master-solver.ru}
      MAX_USE_POLLING: ${MAX_USE_POLLING:-1}
    volumes:
      - sutramax_data:/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  sutramax_data:
  sutramax_pgdata: